<style>:root { box-sizing: border-box; --bg: rgb(238,246,255); --card: rgb(255,255,255); --tx: rgb(18,38,63); --mut: rgb(90,107,130); --pr: rgb(30,111,217); --prtx: rgb(255,255,255); --ac: rgb(255,217,90); --actx: rgb(74,58,0); --ok: rgb(31,143,78); --bad: rgb(201,59,59); --bd: rgb(207,224,245); }@media not all { :root:not([data-theme="light"]) { --bg: rgb(15,27,45); --card: rgb(24,40,63); --tx: rgb(232,240,251); --mut: rgb(159,178,204); --pr: rgb(77,151,245); --prtx: rgb(6,20,38); --ac: rgb(232,194,74); --actx: rgb(43,34,0); --ok: rgb(76,194,125); --bad: rgb(240,122,122); --bd: rgb(43,66,98); } }html {  }* { box-sizing: border-box; }body { margin: 0; background: var(--bg); color: var(--tx); font: normal 17px / 1.55 system-ui, "Segoe UI", Roboto, sans-serif; }main { max-width: 640px; margin: 0 auto 0 auto; padding: 14px 14px 80px 14px; }h1, h2, h3 { line-height: 1.25; margin: 0.3em 0 0.3em 0; }.hero { background: linear-gradient(135,var(--pr),rgb(90,169,255)); color: rgb(255, 255, 255); border-radius: 20px; padding: 20px; text-align: center; }.hero small { display: block; opacity: 0.9; }.hero .sky { font-size: 42px; }.card { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 14px; margin: 12px 0 12px 0; }.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit inherit 700 inherit inherit inherit inherit; background: var(--pr); color: var(--prtx); margin: 8px 0 8px 0; cursor: pointer; text-align: center; }.btn.y { background: var(--ac); color: var(--actx); }.btn.g { background: transparent; color: var(--pr); border: 2px solid var(--pr); }.btn.big { padding: 20px; font-size: 19px; }.row { display: flex; gap: 8px; flex-wrap: wrap; }.row > * { flex: 1 0%; min-width: 120px; }.top { display: flex; align-items: center; gap: 8px; }.top button { width: auto; margin: 0; padding: 8px 14px 8px 14px; }input, textarea, select { width: 100%; font: inherit inherit inherit inherit inherit inherit inherit; padding: 11px; border: 2px solid var(--bd); border-radius: 12px; background: var(--card); color: var(--tx); margin: 4px 0 10px 0; }label { font-weight: 600; }.bar { height: 14px; background: var(--bd); border-radius: 9px; overflow: hidden; }.bar i { display: block; height: 100%; background: var(--ok); }.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }.em { border: 2px solid var(--bd); background: var(--card); color: var(--tx); border-radius: 14px; padding: 10px 6px 10px 6px; font: inherit inherit inherit 14px inherit inherit inherit; cursor: pointer; }.em b { display: block; font-size: 30px; }.em.on { : ; border-top-color: ; border-right-color: ; border-bottom-color: ; border-left-color: ; background: var(--ac); color: var(--actx); }.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 2px solid var(--bd); border-radius: 12px; margin: 6px 0 6px 0; cursor: pointer; }.opt input { width: auto; margin: 5px 0 0 0; }.opt.ok { : ; border-top-color: ; border-right-color: ; border-bottom-color: ; border-left-color: ; }.opt.bad { : ; border-top-color: ; border-right-color: ; border-bottom-color: ; border-left-color: ; }.fb { padding: 10px; border-radius: 12px; background: var(--bg); margin: 6px 0 6px 0; font-size: 15px; }.ok-t { color: var(--ok); font-weight: 700; }.bad-t { color: var(--bad); font-weight: 700; }.tl { border: 4px solid var(--ac); padding-left: 12px; margin: 10px 0 10px 0; }.tl p { margin: 6px 0 6px 0; }.tag { display: inline-block; background: var(--ac); color: var(--actx); border-radius: 9px; padding: 2px 9px 2px 9px; font-size: 13px; font-weight: 700; }.st { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0 6px 0; font-size: 15px; }#toast { position: fixed; left: 12px; right: 12px; max-width: 600px; margin: auto; background: var(--tx); color: var(--bg); border-radius: 12px; padding: 12px; text-align: center; display: none; z-index: 9; }.note { font-size: 14px; color: var(--mut); }pre { white-space: pre-wrap; background: var(--bg); padding: 10px; border-radius: 10px; font-size: 14px; max-height: 260px; overflow: auto; }</style></head><body>
<main id="app"></main><footer class="note" style="text-align: center; padding: 0 14px 90px 14px; margin-top: -60px;">Ruang Belajar Bu Adel · SDN 02 Nan Sabaris<br>Dibuat oleh <b>Almasyrifa Delia Putri, S.Pd., Gr.</b></footer><div id="toast" role="status"></div>
<script>
const K='rbc_sdn02_v1';let S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S.read=S.read||{};S.act=S.act||{};S.kuis=S.kuis||{h:[]};S.ev=S.ev||{pg:{},bs:{},ur:{},sent:false};S.help=S.help||[];S.refl=S.refl||{};S.mood=S.mood||null;S.tahap=S.tahap||null;
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('⚠️ Gagal menyimpan di HP ini. Data belum tersimpan.');return false}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3200)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const today=()=>new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

const BAB=[
{e:'📜',t:'Mengenal Sejarah Perjuangan',h:`<p><b>Sejarah</b> adalah cerita tentang peristiwa masa lalu yang menjadi pelajaran bagi masa kini. <b>Pahlawan</b> adalah orang yang berjuang dan berkorban demi kepentingan masyarakat dan bangsa. <b>Perjuangan</b> adalah usaha sungguh-sungguh untuk mencapai tujuan yang baik.</p><p>Kita mempelajari sejarah agar menghargai jasa para pejuang dan mengambil teladan dari mereka. Peristiwa sejarah dibuat oleh tokoh, masyarakat, dan keadaan lingkungan pada zamannya.</p>`,p:['Mengapa kita perlu mengetahui perjuangan para pahlawan?','Apa yang dapat kita lakukan untuk menghargai jasa pahlawan?'],q:{q:'Mengapa kita mempelajari sejarah perjuangan?',o:['Supaya bisa menghafal tanggal saja','Supaya menghargai jasa pahlawan dan meneladani nilainya','Supaya tidak perlu belajar hal lain','Supaya bisa menyalahkan orang lain'],a:1,w:'Sejarah bukan hanya hafalan. Kita belajar agar menghargai perjuangan dan meneladani nilai-nilainya.'}},
{e:'🗺️',t:'Mengenal Sumatra Barat',h:`<p>Sumatra Barat berada di bagian barat <b>Pulau Sumatra</b>, menghadap Samudra Hindia. Mayoritas penduduk aslinya adalah suku <b>Minangkabau</b> dengan adat, bahasa, dan budaya yang khas, seperti rumah gadang dan musyawarah.</p><p>Pada masa penjajahan, rakyat harus menghadapi aturan dan pajak dari pemerintah kolonial yang memberatkan kehidupan. Karena itu persatuan sangat penting untuk menghadapi penindasan.</p><p class="note">🖼️ Ilustrasi peta: Pulau Sumatra di sebelah barat Indonesia; Sumatra Barat di pesisir baratnya. Buka atlas atau peta di kelas untuk mengamatinya.</p>`,p:['Apa yang kamu ketahui tentang budaya Minangkabau?'],q:{q:'Sumatra Barat terletak di bagian ... Pulau Sumatra.',o:['Timur','Selatan','Barat','Utara'],a:2,w:'Sumatra Barat berada di pesisir barat Pulau Sumatra.'}},
{e:'⚔️',t:'Perang Padri',h:`<p>Perang Padri berlangsung pada awal abad ke-19, sekitar <b>tahun 1803 sampai 1838</b>. Ini <b>bukan satu peristiwa singkat</b>, tetapi perang yang berlangsung dalam beberapa tahap.</p><div class="tl"><p><b>±1803</b> Perbedaan pandangan antara <b>Kaum Padri</b> (ulama yang ingin menegakkan ajaran agama) dan <b>Kaum Adat</b> berubah menjadi pertentangan.</p><p><b>1821</b> Kaum Adat meminta bantuan <b>Belanda</b>. Sejak itu Belanda ikut campur.</p><p><b>Setelah itu</b> Kaum Padri dan sebagian Kaum Adat bersatu melawan Belanda.</p><p><b>1837</b> Benteng Bonjol jatuh dan Tuanku Imam Bonjol ditangkap.</p><p><b>1838</b> Perlawanan Padri berakhir.</p></div><p>Tokoh Padri lain antara lain <b>Tuanku Nan Renceh</b> dari wilayah Agam. Dampak perang: banyak korban, kerusakan, dan penderitaan rakyat. Pelajarannya: konflik antar saudara mudah dimanfaatkan pihak luar.</p>`,p:['Mengapa konflik dapat dimanfaatkan pihak lain?','Nilai apa yang dapat kita pelajari dari Perang Padri?'],q:{q:'Mengapa Perang Padri berubah menjadi perlawanan terhadap Belanda?',o:['Karena Belanda ikut campur setelah dimintai bantuan oleh Kaum Adat','Karena rakyat ingin pindah ke pulau lain','Karena Belanda membangun sekolah','Karena perang itu hanya berlangsung sehari'],a:0,w:'Pada 1821 Kaum Adat meminta bantuan Belanda, sehingga Belanda ikut campur dan akhirnya perlawanan diarahkan kepada penjajah.'}},
{e:'🛡️',t:'Tuanku Imam Bonjol',h:`<p><b>Tuanku Imam Bonjol</b> (nama kecil Muhammad Shahab) lahir sekitar tahun 1772 di Tanjung Bunga, daerah Bonjol, Pasaman. Ia menjadi pemimpin penting Kaum Padri dan berpusat di Benteng Bonjol.</p><p>Ia memimpin perlawanan terhadap Belanda dengan keteguhan. Setelah pertahanan Bonjol jatuh dan ia ditangkap pada tahun 1837, ia diasingkan ke Cianjur, Ambon, lalu Manado. Ia wafat pada <b>6 November 1864</b> di Lotak, Minahasa, Sulawesi Utara. Pemerintah menetapkannya sebagai <b>Pahlawan Nasional</b> pada tahun 1973.</p><p class="note">🖼️ Gambar tokoh di buku atau media lain adalah ilustrasi; guru akan menunjukkan sumbernya.</p>`,p:['Sikap apa dari Tuanku Imam Bonjol yang dapat kamu teladani?'],q:{q:'Tuanku Imam Bonjol berasal dari daerah ...',o:['Bonjol, Pasaman','Padang Panjang saja','Pulau Jawa','Aceh'],a:0,w:'Beliau lahir di Tanjung Bunga, daerah Bonjol, Pasaman, dan memimpin dari Benteng Bonjol.'}},
{e:'👩',t:'Perjuangan Siti Manggopoh',h:`<p><b>Siti Manggopoh</b> adalah pejuang perempuan dari Manggopoh, Kabupaten Agam. Pada awal abad ke-20 pemerintah Belanda menetapkan pajak uang (<b>belasting</b>) yang memberatkan rakyat.</p><p>Rakyat Manggopoh menolak pajak itu. Pada bulan <b>Juni 1908</b> terjadi perlawanan yang dikenal sebagai <b>Perang Belasting</b>, dan Siti Manggopoh bersama masyarakat ikut memimpin penyerangan terhadap pos Belanda. Setelah itu ia ditangkap dan dihukum oleh Belanda.</p><p>Ia menunjukkan <b>keberanian, keteguhan, dan kepedulian</b> kepada masyarakat. Perempuan juga berperan besar dalam perjuangan bangsa. Sebagai Pahlawan Nasional, namanya dihormati sampai sekarang.</p>`,p:['Tuliskan pendapatmu tentang peran perempuan dalam perjuangan bangsa.'],q:{q:'Perang Belasting di Manggopoh adalah perlawanan terhadap ...',o:['Kekurangan air','Pajak uang yang memberatkan rakyat','Pembangunan jalan','Perdagangan rempah'],a:1,w:'Belasting berarti pajak. Rakyat menolak pajak kolonial yang memberatkan.'}},
{e:'🌟',t:'Nilai Perjuangan & Rangkuman',h:`<p>Nilai yang dapat kita teladani:</p><p>🇮🇩 Cinta tanah air · 🤝 Persatuan dan kerja sama · 💪 Keberanian · 🧠 Berpikir kritis · ❤️ Peduli sesama · 🙏 Menghargai perbedaan · 🌱 Pantang menyerah · 📚 Menghargai sejarah dan budaya daerah</p><p>Contoh di sekolah: bekerja sama dalam kelompok, membantu teman, menghormati perbedaan pendapat, dan belajar dengan tekun.</p><div class="card"><b>Rangkuman:</b><br>• Sejarah penting untuk meneladani pahlawan.<br>• Perang Padri (±1803–1838) melibatkan Kaum Padri, Kaum Adat, lalu Belanda.<br>• Tuanku Imam Bonjol memimpin perlawanan dari Bonjol.<br>• Siti Manggopoh melawan pajak kolonial pada 1908.<br>• Persatuan rakyat adalah kunci menghadapi penindasan.</div>`,p:['Nilai apa yang ingin kamu terapkan mulai hari ini?'],q:{q:'Contoh menerapkan persatuan di sekolah adalah ...',o:['Bermain sendiri terus','Mengerjakan tugas kelompok bersama-sama','Menertawakan teman','Tidak mau membantu'],a:1,w:'Persatuan terlihat dari kerja sama dan saling membantu.'}}];

const KUIS=[
{q:'Perang Padri terjadi pada awal abad ke ...',o:['17','18','19','20'],a:2,w:'Perang Padri berlangsung sekitar 1803–1838, yaitu abad ke-19.'},
{q:'Siapa dua kelompok yang berselisih pada awal Perang Padri?',o:['Kaum Padri dan Kaum Adat','Kaum Padri dan Jepang','Belanda dan Inggris','Siti Manggopoh dan Belanda'],a:0,w:'Awalnya terjadi pertentangan antara Kaum Padri dan Kaum Adat.'},
{q:'Siapa pemimpin Padri yang berpusat di Benteng Bonjol?',o:['Tuanku Imam Bonjol','Siti Manggopoh','Pangeran Diponegoro','Sultan Hasanuddin'],a:0,w:'Tuanku Imam Bonjol memimpin perlawanan dari Benteng Bonjol.'},
{q:'Perang Belasting di Manggopoh terjadi pada tahun ...',o:['1803','1837','1908','1945'],a:2,w:'Perang Belasting terjadi pada Juni 1908.'},
{q:'Pelajaran dari Perang Padri adalah ...',o:['Konflik sesama mudah dimanfaatkan pihak luar','Perang selalu menguntungkan semua pihak','Persatuan tidak penting','Sejarah tidak berguna'],a:0,w:'Perselisihan antar sesama dapat dimanfaatkan penjajah, sehingga persatuan sangat penting.'}];

const EPG=[
{q:'Sejarah adalah ...',o:['Kisah peristiwa masa lalu yang menjadi pelajaran','Cerita khayalan','Ramalan masa depan','Daftar belanja'],a:0,w:'Sejarah adalah kisah peristiwa masa lalu yang bermanfaat sebagai pelajaran.'},
{q:'Siapakah yang mengawali Perang Padri dengan berselisih?',o:['Kaum Padri dan Kaum Adat','Belanda dan Jepang','Rakyat dan pedagang','Guru dan siswa'],a:0,w:'Awalnya pertentangan Kaum Padri dan Kaum Adat; Belanda ikut campur pada 1821.'},
{q:'Tuanku Imam Bonjol wafat di pengasingan di daerah ...',o:['Bali','Minahasa (Sulawesi Utara)','Lombok','Kalimantan Selatan'],a:1,w:'Beliau wafat pada 1864 di Lotak, Minahasa, Sulawesi Utara.'},
{q:'Siti Manggopoh berasal dari Manggopoh, kabupaten ...',o:['Agam','Pasaman Barat','Padang Pariaman','Solok'],a:0,w:'Manggopoh berada di Kabupaten Agam.'},
{q:'Sikap meneladani pahlawan di sekolah adalah ...',o:['Bekerja sama dan saling membantu','Memilih teman tertentu saja','Menyontek','Tidak peduli'],a:0,w:'Kerja sama dan saling membantu mencerminkan persatuan.'}];
const EBS=[
{q:'Perang Padri hanya berlangsung dalam satu peristiwa singkat.',a:false,w:'Salah. Perang Padri berlangsung bertahap, sekitar 1803–1838.'},
{q:'Siti Manggopoh melawan pajak yang memberatkan rakyat.',a:true,w:'Benar. Ia ikut dalam Perang Belasting 1908.'},
{q:'Menghargai perbedaan pendapat adalah nilai yang dapat diteladani.',a:true,w:'Benar. Persatuan tumbuh dari sikap saling menghargai.'}];
const EUR=['Jelaskan secara singkat latar belakang Perang Padri.','Jelaskan cara menerapkan persatuan dan cinta tanah air di sekolah.'];

const MOOD=[['😀','Sangat bersemangat!'],['😊','Senang belajar hari ini'],['🤔','Sedang berpikir'],['🧐','Sedang menyelidiki'],['😕','Masih bingung'],['😴','Lelah, perlu istirahat'],['😟','Mengalami kesulitan'],['🙋','Butuh bantuan guru'],['😌','Sudah memahami'],['🎉','Berhasil menyelesaikan!']];
const TAHAP=[['👀','Mengamati'],['🤔','Merenungkan'],['🔎','Menyelidiki'],['✍️','Mengerjakan'],['🧠','Memahami'],['💬','Berdiskusi'],['🎯','Menguji pemahaman'],['📝','Mengevaluasi diri'],['🙋','Meminta bantuan'],['🎉','Menyelesaikan kegiatan']];

const $a=document.getElementById('app');
function pct(){const r=Object.values(S.read).filter(Boolean).length,a=Object.keys(S.act).length;return{m:Math.round(r/BAB.length*100),a:Math.round(a/BAB.length*100)}}
const bar=(v)=>`<div class="bar" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v}%"></i></div>`;
const top=(t,back='home')=>`<div class="top"><button class="btn g" onclick="go('${back}')">⬅️ Kembali</button><h2 style="margin:0">${t}</h2></div>`;
let V='home',A=0,T0=0;
function go(v,a){V=v;A=a??0;draw();scrollTo(0,0)}
function draw(){$a.innerHTML=({home,absen,rasa,materi,bab,kuis,evalu,refl,bantuan,lapor}[V])();}

function home(){const p=pct(),k=S.kuis.h.length?'Selesai':'Belum dikerjakan';
return `<div class="hero"><div class="sky">📚🏫</div><h1>SELAMAT DATANG DI RUANG BELAJAR BU ADEL</h1><b>SDN 02 NAN SABARIS</b><small>Belajar dari rumah, tetap semangat, tetap ceria, dan terus berkarya!</small></div>
<div class="card">👩‍🏫 <b>Halo ${esc(S.nama||'anak hebat')}!</b> Bu Adel senang kamu belajar hari ini.<div class="note">📅 ${today()}<br>📖 IPAS Kelas VI — Jejak Sang Pahlawan: Perjuangan Rakyat Sumatra Barat</div></div>
<button class="btn big" onclick="go('materi')">📚 Mulai Belajar</button>
<div class="row"><button class="btn y" onclick="go('absen')">📝 Isi Absensi</button><button class="btn y" onclick="next()">🎯 Lanjutkan Kegiatan</button></div>
<div class="row"><button class="btn g" onclick="go('rasa')">😊 Perasaanku</button><button class="btn g" onclick="go('lapor')">📤 Kirim Laporan ke Guru</button></div>
<div class="card"><b>🏆 Progres Belajarmu</b>
<div class="st"><span>📚 Materi</span><b>${p.m}%</b></div>${bar(p.m)}
<div class="st"><span>✍️ Aktivitas</span><b>${p.a}%</b></div>${bar(p.a)}
<div class="st"><span>📝 Absensi</span><b>${S.abs?S.abs.status:'Belum'}</b></div>
<div class="st"><span>🎯 Kuis</span><b>${k}</b></div>
<div class="st"><span>📋 Evaluasi</span><b>${S.ev.sent?'Sudah dikirim':'Belum dikirim'}</b></div>
<div class="st"><span>💬 Refleksi</span><b>${S.refl.sent?'Sudah dikirim':'Belum dikirim'}</b></div></div>
<div class="card"><b>🏠 Petunjuk belajar dari rumah</b><br>1. Isi absensi. 2. Baca materi dan kerjakan aktivitas. 3. Coba kuis. 4. Kerjakan evaluasi. 5. Kirim laporan ke guru lewat WhatsApp.<div class="note">Progresmu tersimpan di HP ini. Gunakan HP yang sama agar bisa melanjutkan.</div></div>
<button class="btn big" style="background:var(--bad);color:#fff" onclick="go('bantuan')">🙋 BU ADEL, SAYA BUTUH BANTUAN</button>`}
function next(){if(!S.nama)return go('absen');const i=BAB.findIndex((b,i)=>!S.read[i]);if(i>=0)return go('bab',i);if(!S.kuis.h.length)return go('kuis');if(!S.ev.sent)return go('evalu');if(!S.refl.sent)return go('refl');toast('🎉 Semua kegiatan sudah selesai!');go('lapor')}

function absen(){const a=S.abs||{};
return top('📝 Absensi')+`<div class="card"><label>Nama lengkap</label><input id="nm" value="${esc(S.nama)}" autocomplete="name" maxlength="60">
<label>Kelas</label><input id="kl" value="${esc(S.kelas||'VI')}" maxlength="10">
<label>Nomor absen</label><input id="no" type="number" inputmode="numeric" min="1" max="60" value="${esc(S.no)}">
<label>Tanggal pembelajaran</label><input value="${today()}" disabled>
<label>Kehadiran</label><div class="row"><button class="em ${a.status=='Hadir'?'on':''}" onclick="setAbs('Hadir')"><b>🟢</b>Hadir</button><button class="em ${a.status=='Izin'?'on':''}" onclick="setAbs('Izin')"><b>🟡</b>Izin</button></div>
<label style="display:block;margin-top:10px">Keterangan / kendala (boleh kosong)</label><textarea id="kt" rows="2" maxlength="200">${esc(a.ket)}</textarea>
<div class="note">Absensi tanpa foto. Waktu dicatat dari jam HP kamu.</div>
<button class="btn" onclick="saveAbs()">✅ Simpan Absensi</button></div>`}
function setAbs(s){S.abs=S.abs||{};S.abs.status=s;draw();}
function saveAbs(){const n=document.getElementById('nm').value.trim(),k=document.getElementById('kl').value.trim(),o=document.getElementById('no').value.trim();
if(!n||!k||!o)return toast('Isi nama, kelas, dan nomor absen dulu ya 🙂');if(!(S.abs&&S.abs.status))return toast('Pilih Hadir atau Izin dulu.');
S.nama=n;S.kelas=k;S.no=o;S.abs.ket=document.getElementById('kt').value.trim();S.abs.waktu=now();if(save()){toast('✅ Absensi tersimpan di HP kamu. Jangan lupa kirim laporan ke guru.');go('home')}}

function rasa(){return top('😊 Perasaanku')+`<div class="card"><b>Bagaimana perasaanmu saat belajar hari ini?</b><div class="grid" style="margin-top:8px">${MOOD.map((m,i)=>`<button class="em ${S.mood&&S.mood.i==i?'on':''}" onclick="pick('mood',${i})"><b>${m[0]}</b>${m[1]}</button>`).join('')}</div></div>
<div class="card"><b>Kamu sedang melakukan apa?</b><div class="grid" style="margin-top:8px">${TAHAP.map((m,i)=>`<button class="em ${S.tahap&&S.tahap.i==i?'on':''}" onclick="pick('tahap',${i})"><b>${m[0]}</b>${m[1]}</button>`).join('')}</div></div><p class="note">Pilihanmu membantu guru, tetapi bukan penilaian.</p>`}
function pick(k,i){S[k]={i,t:now()};if(save())draw()}

function materi(){const r=Object.values(S.read).filter(Boolean).length;
return top('📚 Materi')+`<p><b>JEJAK SANG PAHLAWAN</b><br>Perjuangan Rakyat Sumatra Barat</p>${BAB.map((b,i)=>`<button class="btn ${S.read[i]?'g':''}" onclick="go('bab',${i})" style="text-align:left">${b.e} Bagian ${i+1}: ${b.t} ${S.read[i]?'✅':''}</button>`).join('')}
<div class="row"><button class="btn y" onclick="go('kuis')">🎯 Mulai Kuis</button><button class="btn y" onclick="go('evalu')">📝 Evaluasi</button></div><p class="note">${r} dari ${BAB.length} bagian sudah kamu tandai selesai dibaca.</p>`}

function bab(){const i=A,b=BAB[i],a=S.act[i];
return top(`${b.e} Bagian ${i+1}`,'materi')+`<h3>${b.t}</h3><div class="card">${b.h}</div>
<div class="card"><b>🤔 Pertanyaan pemantik</b><br>${b.p.map(x=>'• '+x).join('<br>')}</div>
<div class="card"><b>✍️ Aktivitas</b><p>${b.q.q}</p>${b.q.o.map((o,j)=>`<label class="opt ${a?(j==b.q.a?'ok':(a.pick==j?'bad':'')):''}"><input type="radio" name="act" value="${j}" ${a&&a.pick==j?'checked':''}> ${esc(o)}</label>`).join('')}
<button class="btn y" onclick="chkAct(${i})">🔍 Periksa Jawaban</button>${a?`<div class="fb"><span class="${a.ok?'ok-t':'bad-t'}">${a.ok?'✅ Benar!':'❌ Belum tepat.'}</span> ${esc(b.q.w)}</div>`:''}</div>
<button class="btn" onclick="markRead(${i})">${S.read[i]?'✅ Sudah dibaca':'📖 Saya sudah membaca'}</button>
<div class="row">${i>0?`<button class="btn g" onclick="go('bab',${i-1})">⬅️ Sebelumnya</button>`:''}${i<BAB.length-1?`<button class="btn g" onclick="go('bab',${i+1})">Berikutnya ➡️</button>`:`<button class="btn y" onclick="go('kuis')">🎯 Mulai Kuis</button>`}</div>`}
function chkAct(i){const s=document.querySelector('input[name=act]:checked');if(!s)return toast('Pilih jawaban dulu ya.');const p=+s.value;S.act[i]={pick:p,ok:p==BAB[i].q.a,t:now()};if(save())draw()}
function markRead(i){S.read[i]=true;if(save()){toast('✅ Tersimpan');go('bab',i)}}

function qHTML(arr,pre,res){return arr.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt ${res?(j==q.a?'ok':(res[i]==j?'bad':'')):''}"><input type="radio" name="${pre}${i}" value="${j}" ${res&&res[i]==j?'checked':''} ${res?'disabled':''}> ${esc(o)}</label>`).join('')}${res?`<div class="fb"><span class="${res[i]==q.a?'ok-t':'bad-t'}">${res[i]==q.a?'✅ Benar':'❌ Kurang tepat'}</span> ${esc(q.w)}</div>`:''}</div>`).join('')}
const rd=(pre,n)=>[...Array(n)].map((_,i)=>{const e=document.querySelector(`input[name=${pre}${i}]:checked`);return e?+e.value:null});

function kuis(){const h=S.kuis.h,l=h[h.length-1];
if(A==1&&l){const m=l.skor>=90?['🏆','Luar biasa! Kamu sangat memahami materi.']:l.skor>=80?['🌟','Bagus sekali! Terus pertahankan semangatmu.']:l.skor>=70?['😊','Bagus! Pelajari kembali bagian yang belum dikuasai.']:['💪','Jangan menyerah! Baca kembali materi dan coba lagi.'];
return top('🎯 Hasil Kuis')+`<div class="hero"><div class="sky">${m[0]}</div><h1>Skor ${l.skor}</h1><b>Benar ${l.benar} · Salah ${KUIS.length-l.benar}</b><small>${m[1]}</small></div><div class="note" style="margin:8px 0">Percobaan ke-${h.length} · waktu ${l.dur} detik</div><b>📖 Pelajari Kesalahan</b>${qHTML(KUIS,'k',l.jw)}<div class="row"><button class="btn g" onclick="go('kuis')">🔁 Ulangi Kuis</button><button class="btn y" onclick="go('evalu')">📝 Lanjut ke Evaluasi</button></div>`}
if(!T0)T0=Date.now();
return top('🎯 KUIS PAHLAWAN SUMATRA BARAT','materi')+`<p>Pilih satu jawaban paling tepat untuk setiap soal.${h.length?` Skor terakhirmu: <b>${l.skor}</b>.`:''}</p>${qHTML(KUIS,'k')}<button class="btn" onclick="sendKuis()">✅ Periksa Jawaban</button>`}
function sendKuis(){const jw=rd('k',KUIS.length);if(jw.includes(null))return toast('Jawab semua soal dulu ya 🙂');const b=jw.filter((x,i)=>x==KUIS[i].a).length;
S.kuis.h.push({skor:Math.round(b/KUIS.length*100),benar:b,dur:Math.round((Date.now()-T0)/1000),jw,t:now()});T0=0;if(save())go('kuis',1)}

function evalu(){const E=S.ev;
if(E.sent){const sc=evalSkor();return top('📝 Evaluasi')+`<div class="card"><b>✅ Evaluasi sudah dikirim dan jawabanmu diterima di HP ini.</b><br>Nilai otomatis (pilihan ganda + benar/salah): <b>${sc}</b><br>Uraian: menunggu penilaian guru.</div>${qHTML(EPG,'p',E.pg)}${EBS.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><div class="fb">Jawabanmu: ${E.bs[i]===true?'Benar':'Salah'} — ${esc(q.w)}</div></div>`).join('')}${EUR.map((q,i)=>`<div class="card"><b>${esc(q)}</b><div class="fb">${esc(E.ur[i])}</div></div>`).join('')}<button class="btn y" onclick="go('refl')">💬 Isi Refleksi</button>`}
return top('📝 Evaluasi','materi')+`<p>Evaluasi ini berbeda dari kuis latihan. Jawab dengan jujur dan teliti.</p><h3>A. Pilihan Ganda</h3>${qHTML(EPG,'p')}<h3>B. Benar atau Salah</h3>${EBS.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><label class="opt"><input type="radio" name="b${i}" value="1"> Benar</label><label class="opt"><input type="radio" name="b${i}" value="0"> Salah</label></div>`).join('')}<h3>C. Uraian</h3>${EUR.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q)}</b><textarea id="u${i}" rows="4" maxlength="800">${esc(E.ur[i])}</textarea></div>`).join('')}
<div class="row"><button class="btn g" onclick="draf()">💾 Simpan Draf</button><button class="btn" onclick="kirimEv()">📤 Kirim Evaluasi</button></div>${E.draft?'<p class="note">Draf tersimpan.</p>':''}`}
function readEv(){const E=S.ev;rd('p',EPG.length).forEach((v,i)=>{if(v!==null)(E.pg[i]=v)});EBS.forEach((_,i)=>{const e=document.querySelector(`input[name=b${i}]:checked`);if(e)E.bs[i]=e.value=='1'});EUR.forEach((_,i)=>E.ur[i]=document.getElementById('u'+i).value.trim())}
function draf(){readEv();S.ev.draft=true;if(save())toast('💾 Draf tersimpan di HP ini')}
function kirimEv(){readEv();const E=S.ev;if(Object.keys(E.pg).length<EPG.length||Object.keys(E.bs).length<EBS.length||EUR.some((_,i)=>!E.ur[i]))return toast('Lengkapi semua jawaban sebelum dikirim.');if(!confirm('Kirim evaluasi? Setelah dikirim, jawaban tidak bisa diubah.'))return;E.sent=true;E.waktu=now();if(save()){toast('✅ Evaluasi diterima. Kirim laporan ke guru ya!');draw()}}
function evalSkor(){const E=S.ev;let b=0;EPG.forEach((q,i)=>{if(E.pg[i]==q.a)b++});EBS.forEach((q,i)=>{if(E.bs[i]===q.a)b++});return Math.round(b/(EPG.length+EBS.length)*100)}

const RQ=['😊 Bagaimana perasaanmu setelah belajar sejarah hari ini?','💡 Hal baru apa yang kamu pelajari?','🤔 Bagian mana yang masih membingungkan?','❤️ Sikap pahlawan apa yang ingin kamu teladani?'];
const RP=['😀 Saya memahami materi.','🙂 Saya cukup memahami materi.','🤔 Saya perlu membaca kembali.','🙋 Saya membutuhkan bantuan.'];
function refl(){const R=S.refl;return top('💬 Refleksi')+RQ.map((q,i)=>`<div class="card"><b>${q}</b><textarea id="r${i}" rows="2" maxlength="400">${esc(R['q'+i])}</textarea></div>`).join('')+`<div class="card"><b>Pilih yang paling sesuai:</b>${RP.map((p,i)=>`<label class="opt"><input type="radio" name="rp" value="${i}" ${R.p==i?'checked':''}> ${p}</label>`).join('')}</div><button class="btn" onclick="sendR()">📤 Kirim Refleksi</button>${R.sent?'<p class="note">Refleksi tersimpan '+esc(R.waktu)+'. Kamu boleh memperbaruinya.</p>':''}`}
function sendR(){const R=S.refl;RQ.forEach((_,i)=>R['q'+i]=document.getElementById('r'+i).value.trim());const e=document.querySelector('input[name=rp]:checked');if(!e)return toast('Pilih salah satu tingkat pemahamanmu.');R.p=+e.value;R.sent=true;R.waktu=now();if(save()){toast('✅ Refleksi tersimpan');go('lapor')}}

const HB=['📖 Saya belum memahami materi.','✍️ Saya kesulitan mengerjakan soal.','📱 HP atau perangkat saya bermasalah.','🌐 Internet saya tidak stabil.','💬 Saya ingin bertanya kepada guru.'];
function bantuan(){return top('🙋 Minta Bantuan')+`<div class="card"><b>Apa yang kamu butuhkan?</b>${HB.map((h,i)=>`<button class="btn g" style="text-align:left" onclick="help(${i})">${h}</button>`).join('')}</div><p class="note">Permintaan dicatat di laporanmu. Kirim laporan lewat WhatsApp agar guru tahu.</p>${S.help.length?'<div class="card"><b>Permintaanmu:</b><br>'+S.help.map(h=>esc(h.j)+' <span class="note">('+esc(h.t)+')</span>').join('<br>')+'</div>':''}`}
function help(i){S.help.push({j:HB[i],t:now()});if(save()){toast('✅ Tercatat. Kirim laporan ke guru ya.');go('lapor')}}

function laporan(){const p=pct(),l=S.kuis.h[S.kuis.h.length-1],E=S.ev,R=S.refl;
return ['*LAPORAN RUANG BELAJAR BU ADEL*','SDN 02 Nan Sabaris - IPAS Kelas VI',`Nama: ${S.nama||'-'}`,`Kelas: ${S.kelas||'-'} | No. absen: ${S.no||'-'}`,`Tanggal: ${today()}`,`Absensi: ${S.abs?S.abs.status+' ('+S.abs.waktu+')':'Belum'}${S.abs&&S.abs.ket?' - '+S.abs.ket:''}`,`Perasaan: ${S.mood?MOOD[S.mood.i][0]+' '+MOOD[S.mood.i][1]:'-'}`,`Kegiatan: ${S.tahap?TAHAP[S.tahap.i][0]+' '+TAHAP[S.tahap.i][1]:'-'}`,`Materi: ${p.m}% | Aktivitas: ${p.a}%`,`Kuis: ${l?l.skor+' (benar '+l.benar+'/'+KUIS.length+', '+S.kuis.h.length+'x coba, '+l.dur+' dtk)':'Belum'}`,`Evaluasi: ${E.sent?'Dikirim '+E.waktu+' | Nilai otomatis PG+B/S: '+evalSkor():'Belum dikirim'}`,...(E.sent?EUR.map((q,i)=>`Uraian ${i+1}: ${E.ur[i]}`):[]),`Refleksi: ${R.sent?RQ.map((q,i)=>(R['q'+i]||'-')).join(' | ')+' | Pemahaman: '+RP[R.p]:'Belum'}`,`Bantuan: ${S.help.length?S.help.map(h=>h.j).join('; '):'Tidak ada'}`].join('\n')}
function lapor(){return top('📤 Kirim Laporan ke Guru')+`<div class="card"><p>Laporan ini berisi progres, nilai, dan jawabanmu. Tekan tombol di bawah, lalu pilih <b>kontak/grup guru</b> di WhatsApp.</p><pre id="lp">${esc(laporan())}</pre><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(laporan())}">💚 Kirim lewat WhatsApp</a><button class="btn g" onclick="salin()">📋 Salin Laporan</button></div><p class="note">Datamu disimpan di HP ini. Data baru sampai ke guru setelah kamu mengirim laporan.</p>`}
function salin(){const t=laporan();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('📋 Laporan disalin'),()=>toast('Gagal menyalin. Tekan lama teks laporan.'));else toast('Tekan lama teks laporan untuk menyalin.')}
draw();
</script>
</body></html>
